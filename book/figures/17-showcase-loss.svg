<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">One hundred one random-batch loss reports across the showcase training run</title>
  <desc id="desc">The recorded training loss falls from 4.4395 at step 1 to 0.7668 at step 5000, but neighboring reports bounce because each dot grades one random training batch. An inset magnifies steps 3900 through 4500. Orange diamonds mark five pre-update loss reports whose completed updates are followed by progress samples. This plot contains no held-out measurements.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17233d; font-style: normal; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5d6878; }
    .tick { font-size: 14px; fill: #5d6878; }
    .axis-label { font-size: 16px; font-weight: 650; }
    .legend { font-size: 15px; font-weight: 650; }
    .inset-title { font-size: 15px; font-weight: 700; }
    .note { font-size: 15px; fill: #5d6878; }
    .source { font-size: 14px; fill: #5d6878; }
    .grid { stroke: #d6dce5; stroke-width: 1; }
    .axis { stroke: #7a8699; stroke-width: 1.5; }
    .curve { fill: none; stroke: #225fc7; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .inset-curve { fill: none; stroke: #225fc7; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .selection { stroke: #147d64; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .connector { stroke: #147d64; stroke-width: 1.5; }
  </style>
