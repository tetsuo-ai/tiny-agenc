  <text x="86.00" y="68.00" class="subtitle" text-anchor="start">All 101 reports from the uninterrupted 5,000-step showcase run.</text>
  <text x="86.00" y="93.00" class="subtitle" text-anchor="start">The long-run direction falls; neighboring reports can still rise because the batch changes.</text>
