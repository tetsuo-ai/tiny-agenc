  <title id="title">Two-point slopes close in on the local slope at (2, 4)</title>
  <desc id="desc">A graph of y equals x squared with the point (2, 4) fixed. The line to (3, 9) has slope 5. The closer line to (2.5, 6.25) has slope 4.5. The line through the fixed point has local slope 4.</desc>
