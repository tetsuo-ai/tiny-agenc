  <title id="title">Recorded training loss across five thousand steps</title>
  <desc id="desc">A line connects all one hundred one loss reports in the committed showcase log. Loss starts at 4.4395 on step 1 and ends at 0.7668 on step 5000. The reports cover training only. Training ends by saving a checkpoint. A later sample command loads it and does not update the parameters.</desc>
