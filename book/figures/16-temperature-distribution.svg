  <title id="title">Temperature changes the probability spread for logits two, one, and zero</title>
  <desc id="desc">Three deterministic softmax curves from temperature 0.25 through 3. The highest-logit probability falls as temperature rises, while the other two rise. The ranking never changes.</desc>
