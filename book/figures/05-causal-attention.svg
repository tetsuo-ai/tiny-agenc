  <text x="315.00" y="255.00" class="cell-label-light" text-anchor="middle">softmax weight</text>
  <text x="315.00" y="284.00" class="cell-value-light" text-anchor="middle">1.000000</text>
  <rect x="410.00" y="206.00" width="190.00" height="126.00" rx="0" fill="#f5f6f8" stroke="#cbd3df"/>
  <line x1="420.00" y1="216.00" x2="590.00" y2="322.00" stroke="#d7dce4" stroke-width="2"/>
  <line x1="590.00" y1="216.00" x2="420.00" y2="322.00" stroke="#d7dce4" stroke-width="2"/>
  <text x="505.00" y="261.00" class="unused" text-anchor="middle">future position</text>
  <text x="505.00" y="284.00" class="unused" text-anchor="middle">not read</text>
  <rect x="600.00" y="206.00" width="190.00" height="126.00" rx="0" fill="#f5f6f8" stroke="#cbd3df"/>
  <line x1="610.00" y1="216.00" x2="780.00" y2="322.00" stroke="#d7dce4" stroke-width="2"/>
  <line x1="780.00" y1="216.00" x2="610.00" y2="322.00" stroke="#d7dce4" stroke-width="2"/>
  <text x="695.00" y="261.00" class="unused" text-anchor="middle">future position</text>
  <text x="695.00" y="284.00" class="unused" text-anchor="middle">not read</text>
  <rect x="790.00" y="206.00" width="210.00" height="126.00" rx="0" fill="#f1f8f5" stroke="#cbd3df"/>
  <text x="895.00" y="255.00" class="output-label" text-anchor="middle">output t = 0</text>
  <text x="895.00" y="284.00" class="output-value" text-anchor="middle">[2.00000, 1.00000]</text>
  <rect x="40.00" y="332.00" width="180.00" height="126.00" rx="0" fill="#f4f7fb" stroke="#cbd3df"/>
  <text x="58.00" y="381.00" class="row-main" text-anchor="start">query t = 1</text>
  <text x="58.00" y="409.00" class="row-detail" text-anchor="start">Q=[0, 1]</text>
  <rect x="220.00" y="332.00" width="190.00" height="126.00" rx="0" fill="#aabff2" stroke="#cbd3df"/>
  <text x="315.00" y="381.00" class="cell-label" text-anchor="middle">softmax weight</text>
  <text x="315.00" y="410.00" class="cell-value" text-anchor="middle">0.330238</text>
  <rect x="410.00" y="332.00" width="190.00" height="126.00" rx="0" fill="#6285e5" stroke="#cbd3df"/>
  <text x="505.00" y="381.00" class="cell-label-light" text-anchor="middle">softmax weight</text>
  <text x="505.00" y="410.00" class="cell-value-light" text-anchor="middle">0.669762</text>
  <rect x="600.00" y="332.00" width="190.00" height="126.00" rx="0" fill="#f5f6f8" stroke="#cbd3df"/>
  <line x1="610.00" y1="342.00" x2="780.00" y2="448.00" stroke="#d7dce4" stroke-width="2"/>
  <line x1="780.00" y1="342.00" x2="610.00" y2="448.00" stroke="#d7dce4" stroke-width="2"/>
  <text x="695.00" y="387.00" class="unused" text-anchor="middle">future position</text>
  <text x="695.00" y="410.00" class="unused" text-anchor="middle">not read</text>
  <rect x="790.00" y="332.00" width="210.00" height="126.00" rx="0" fill="#f1f8f5" stroke="#cbd3df"/>
  <text x="895.00" y="381.00" class="output-label" text-anchor="middle">output t = 1</text>
  <text x="895.00" y="410.00" class="output-value" text-anchor="middle">[3.33952, 2.33952]</text>
  <rect x="40.00" y="458.00" width="180.00" height="126.00" rx="0" fill="#f4f7fb" stroke="#cbd3df"/>
  <text x="58.00" y="507.00" class="row-main" text-anchor="start">query t = 2</text>
  <text x="58.00" y="535.00" class="row-detail" text-anchor="start">Q=[1, 1]</text>
  <rect x="220.00" y="458.00" width="190.00" height="126.00" rx="0" fill="#bbccf5" stroke="#cbd3df"/>
  <text x="315.00" y="507.00" class="cell-label" text-anchor="middle">softmax weight</text>
  <text x="315.00" y="536.00" class="cell-value" text-anchor="middle">0.248255</text>
  <rect x="410.00" y="458.00" width="190.00" height="126.00" rx="0" fill="#bbccf5" stroke="#cbd3df"/>
  <text x="505.00" y="507.00" class="cell-label" text-anchor="middle">softmax weight</text>
  <text x="505.00" y="536.00" class="cell-value" text-anchor="middle">0.248255</text>
  <rect x="600.00" y="458.00" width="190.00" height="126.00" rx="0" fill="#85a1eb" stroke="#cbd3df"/>
  <text x="695.00" y="507.00" class="cell-label" text-anchor="middle">softmax weight</text>
  <text x="695.00" y="536.00" class="cell-value" text-anchor="middle">0.503490</text>
  <rect x="790.00" y="458.00" width="210.00" height="126.00" rx="0" fill="#f1f8f5" stroke="#cbd3df"/>
  <text x="895.00" y="507.00" class="output-label" text-anchor="middle">output t = 2</text>
  <text x="895.00" y="536.00" class="output-value" text-anchor="middle">[5.51745, 4.51745]</text>
  <text x="40.00" y="619.00" class="footer" text-anchor="start">Each used row sums to 1. Future cells are never scored or passed to softmax.</text>
</svg>
