<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Softmax saturation as a score gap grows</title>
  <desc id="desc">For the two scores gap and zero, the plot shows the higher score probability approaching one and the lower score probability approaching zero at six fixed gaps.</desc>
