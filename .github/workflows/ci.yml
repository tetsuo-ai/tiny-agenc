name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC serial
            compiler: gcc
            openmp: 0
          - name: Clang serial
            compiler: clang
            openmp: 0
          - name: GCC OpenMP
            compiler: gcc
            openmp: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the complete teaching suite
        run: make CC=${{ matrix.compiler }} OPENMP=${{ matrix.openmp }} check-all

  sanitizers:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run instrumented core checks
        run: make CC=gcc check-sanitizers
